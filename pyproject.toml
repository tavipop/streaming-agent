[project]
name = "streaming-agent"
version = "0.1.0"
description = "A streaming agent built on the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "fastapi>=0.161.1",
    "httpx>=0.27",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
streaming-agent = "streaming_agent.cli:main"
streaming-agent-api = "streaming_agent.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_agent"]

# ---------- tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["streaming_agent"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Claude API (needs ANTHROPIC_API_KEY); skipped by default",
]
addopts = "-m 'not live'"
