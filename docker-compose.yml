# Local Arize Phoenix: trace UI + OTLP receiver for the agent's OpenTelemetry spans.
#   UI / OTLP HTTP: http://localhost:6006   (export: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:6006/v1/traces)
#   OTLP gRPC:      localhost:4317
# Start with `make phoenix-up`.
services:
  phoenix:
    image: arizephoenix/phoenix:version-20.23.0
    container_name: streaming-agent-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      # Apple M4 + Linux VM (Colima/Docker): the CPU advertises SME, OpenSSL uses it and the
      # VM traps it -> "Illegal instruction" (exit 132). Disable OpenSSL's CPU feature probing.
      OPENSSL_armcap: "0"
    volumes:
      - phoenix-data:/mnt/data # traces persist across restarts
    restart: unless-stopped

volumes:
  phoenix-data:
